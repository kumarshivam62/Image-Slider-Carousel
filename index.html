<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel - FOCP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container">
        <div class="slides">
            <img src="https://picsum.photos/id/10/800/400" class="slide active" alt="Slide 1">
            <img src="https://picsum.photos/id/20/800/400" class="slide" alt="Slide 2">
            <img src="https://picsum.photos/id/30/800/400" class="slide" alt="Slide 3">
        </div>

        <button class="prev" id="prevBtn">&#10094;</button>
        <button class="next" id="nextBtn">&#10095;</button>

        <div class="dots-container">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
